; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Standard für "pio run" / Upload: die bewährte Seeed-Konfiguration.
; Die offizielle Pico-2-W-Konfiguration unten nur gezielt nutzen: pio run -e rpipico2w
default_envs = seeed_xiao_rp2350

; Das Board ist physisch ein Raspberry Pi Pico 2 W. Die Seeed-Platform funktioniert
; hier zuverlässig, kennt aber nur ihre eigenen Boards. Deshalb: XIAO-RP2350-Board
; als Basis, aber Variante/Flags des Pico 2 W, damit der Funkchip (CYW43) für BLE
; genutzt werden kann.
[env:seeed_xiao_rp2350]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-rp2350
framework = arduino
monitor_speed = 115200

board_build.variant = rpipico2w
board_build.extra_flags = -DARDUINO_RASPBERRY_PI_PICO_2W -DARDUINO_ARCH_RP2040 -DUSBD_MAX_POWER_MA=250 -DPICO_CYW43_SUPPORTED=1 -DCYW43_PIN_WL_DYNAMIC=1
board_upload.psram_length = 0
board_upload.maximum_size = 4194304

build_flags = -DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH

; Optional: offizielle Pico-2-W-Konfiguration (maxgerhardt-Platform).
; Früher hat diese Platform hier nicht funktioniert – deshalb nicht Standard.
; Testen mit:  pio run -e rpipico2w   bzw.   pio run -e rpipico2w --target upload
[env:rpipico2w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
build_flags = -DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
